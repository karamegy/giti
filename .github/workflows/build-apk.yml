name: Build Android App & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-and-android-build"
  cancel-in-progress: false

jobs:
  # 1. بناء تطبيق الأندرويد المُوقّع (APK & AAB)
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App with Capacitor & Gradle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
        run: |
          set -e

          # 1. تجهيز مجلد www وتفريغه من الملفات غير المطلوبة
          rm -rf www
          mkdir -p www
          cp -r index.html style.css app.js manifest.json privacy.html sw.js icon-*.png www/ 2>/dev/null || true

          # 2. إنشاء ملف capacitor.config.json بشكل مباشر ومضمون بدون سكريبتات Node مدمجة
          PKG_NAME="${PACKAGE_NAME:-io.github.karamegy.giti}"
          cat << EOF > capacitor.config.json
          {
            "appId": "$PKG_NAME",
            "appName": "مكتبة الألعاب الفضائية V10.1",
            "webDir": "www"
          }
          EOF

          # 3. تثبيت كافة حزم Capacitor المطلوبة (شاملة @capacitor/android)
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/filesystem @capacitor/share @capacitor/assets --save-dev

          # 4. إعادة إضافة منصة الأندرويد
          rm -rf android
          npx cap add android

          # 5. توليد الأيقونات
          mkdir -p assets
          if [ -f "icon-512.png" ]; then
            cp icon-512.png assets/icon.png
            cp icon-512.png assets/icon-only.png
          elif [ -f "icon-192.png" ]; then
            cp icon-192.png assets/icon.png
            cp icon-192.png assets/icon-only.png
          fi
          npx @capacitor/assets generate --android || true

          # 6. نسخ google-services.json إن وجد
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
          fi

          # 7. مزامنة الملفات مع مشروع الأندرويد
          npx cap sync android

          # 8. فك تشفير الـ Keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/signing.keystore
          fi

          # 9. إعداد التوقيع و Gradle بشكل آمن
          cat << 'EOF_GRADLE' >> android/app/build.gradle

          android {
              defaultConfig {
                  applicationId "${System.getenv('PACKAGE_NAME') ?: 'io.github.karamegy.giti'}"
                  minSdkVersion 24
                  targetSdkVersion 34
                  versionCode 10010
                  versionName "10.1.0"
              }
              signingConfigs {
                  release {
                      storeFile file('signing.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
                      keyAlias System.getenv('KEY_ALIAS') ?: ''
                      keyPassword System.getenv('KEY_PASSWORD') ?: ''
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF_GRADLE

          # 10. تنفيذ البناء
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          ./gradlew bundleRelease --no-daemon

      - name: Upload Signed APK Artifact (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: SpaceGame-V10.1-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Signed AAB Bundle Artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: SpaceGame-V10.1-AAB
          path: android/app/build/outputs/bundle/release/*.aab

  # 2. نشر موقع PWA على GitHub Pages
  deploy-pages:
    needs: build-android
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
