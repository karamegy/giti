name: Build Android Space App V10.1

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Build Signed Android Package
        run: |
          bubblewrap merge --manifest=manifest.json
          bubblewrap build --keyPath=android.keystore --keyAlias=${{ secrets.KEY_ALIAS }} --keyPassword=${{ secrets.KEY_PASSWORD }} --storePassword=${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload Signed APK Output
        uses: actions/upload-artifact@v4
        with:
          name: SpaceGame-V10.1-APK
          path: '*.apk'

      - name: Upload Signed AAB Output (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: SpaceGame-V10.1-AAB
          path: '*.aab'
