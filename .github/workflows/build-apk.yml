name: Build Android App & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-and-android-build"
  cancel-in-progress: true

jobs:
  # 1. بناء تطبيق الأندرويد المُوقّع (APK & AAB)
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android App with Capacitor & Gradle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
        run: |
          set -e

          # 1. تجهيز مجلد الويب www
          rm -rf www
          mkdir -p www
          cp -r index.html style.css app.js manifest.json privacy.html sw.js icon-*.png www/ 2>/dev/null || cp -r * www/ 2>/dev/null || true
          rm -rf www/android www/node_modules www/.git www/.github

          # 2. إنشاء ملف capacitor.config.json مع إضافة إعدادات GoogleAuth
          PKG_NAME="${PACKAGE_NAME:-io.github.karamegy.giti}"
          cat << EOF > capacitor.config.json
          {
            "appId": "$PKG_NAME",
            "appName": "مكتبة الألعاب الفضائية V10.1",
            "webDir": "www",
            "plugins": {
              "GoogleAuth": {
                "scopes": ["profile", "email"],
                "serverClientId": "382519802983-2fbeclnmfvs335qgu6tpdk4tmsg4r8om.apps.googleusercontent.com",
                "forceCodeForRefreshToken": true
              }
            }
          }
          EOF

          # 3. تثبيت حزم Capacitor وتجاوز تعارض الحزم عبر --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/cli @capacitor/core @capacitor/android @capacitor/filesystem @capacitor/share @capacitor/assets @codetrix-studio/capacitor-google-auth --save-dev

          # 4. إعادة إضافة منصة أندرويد
          rm -rf android
          npx cap add android

          # 5. توليد الأيقونات
          mkdir -p assets
          if [ -f "icon-512.png" ]; then
            cp icon-512.png assets/icon.png
            cp icon-512.png assets/icon-only.png
          elif [ -f "icon-192.png" ]; then
            cp icon-192.png assets/icon.png
            cp icon-192.png assets/icon-only.png
          fi
          npx @capacitor/assets generate --android || true

          # 6. نسخ google-services.json إن وجد
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
          fi

          # 7. إعداد ملفات الأذونات والـ AndroidManifest و strings.xml
          mkdir -p android/app/src/main/res/xml/
          cat << 'EOF_PATHS' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="external_files" path="." />
              <cache-path name="cache_files" path="." />
              <files-path name="files_path" path="." />
          </paths>
          EOF_PATHS

          mkdir -p android/app/src/main/res/values/
          cat << EOF_STRINGS > android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">مكتبة الألعاب الفضائية V10.1</string>
              <string name="title_activity_main">MainActivity</string>
              <string name="package_name">$PKG_NAME</string>
              <string name="custom_url_scheme">$PKG_NAME</string>
              <string name="server_client_id">382519802983-2fbeclnmfvs335qgu6tpdk4tmsg4r8om.apps.googleusercontent.com</string>
          </resources>
          EOF_STRINGS

          cat << EOF_MANIFEST > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="$PKG_NAME">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme"
                  tools:overrideLibrary="com.getcapacitor.android">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="$PKG_NAME.MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="$PKG_NAME.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>
          </manifest>
          EOF_MANIFEST

          # 8. استخراج شهادة التوقيع
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/signing.keystore
          fi

          # 9. إعداد التوقيع في build.gradle بأمان عبر متغيّرات البيئة
          cat << 'EOF_GRADLE' >> android/app/build.gradle

          android {
              defaultConfig {
                  applicationId System.getenv('PACKAGE_NAME') ?: 'io.github.karamegy.giti'
                  minSdkVersion 24
                  targetSdkVersion 34
                  versionCode 10010
                  versionName "10.1.0"
              }
              signingConfigs {
                  release {
                      storeFile file('signing.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
                      keyAlias System.getenv('KEY_ALIAS') ?: ''
                      keyPassword System.getenv('KEY_PASSWORD') ?: ''
                  }
              }
              buildTypes {
                  release {
                      if (file('signing.keystore').exists() && file('signing.keystore').length() > 0) {
                          signingConfig signingConfigs.release
                      }
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF_GRADLE

          # 10. مزامنة البناء والتنفيذ
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          ./gradlew bundleRelease --no-daemon

      - name: Upload Signed APK Artifact (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: SpaceGame-V10.1-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Signed AAB Bundle Artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: SpaceGame-V10.1-AAB
          path: android/app/build/outputs/bundle/release/*.aab

  # 2. نشر موقع PWA على GitHub Pages
  deploy-pages:
    needs: build-android
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
